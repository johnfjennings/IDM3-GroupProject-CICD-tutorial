# CI: builds, starts and smoke-checks every pull request and every push to develop.
# Read this file top-to-bottom — Week 1 tutorial, Part 2 explains each step.
name: ci

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (compiles the app and checks it starts)
        run: ./mvnw --batch-mode verify

      - name: Start the app and MySQL (also proves the Dockerfile builds)
        run: docker compose up -d --build

      - name: Smoke check
        run: bash .github/smoke-check.sh

      - name: Show the app log if anything failed
        if: failure()
        run: docker compose logs app
