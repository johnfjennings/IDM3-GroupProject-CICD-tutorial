# Deploys the develop branch to the team's TEST server on every merge.
# Requires repo secrets: TEST_HOST, TEST_USER, TEST_SSH_KEY (set by your instructor).
name: deploy-test

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode verify

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:test-latest
          docker build -t "$IMAGE" -t ghcr.io/${{ github.repository }}:develop-${{ github.sha }} .
          docker push --all-tags ghcr.io/${{ github.repository }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to test server over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |
            cd ~/gallery
            docker compose pull app
            docker compose up -d app

      - name: Smoke test — wait for the app to report healthy
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "http://${{ secrets.TEST_HOST }}:8080/actuator/health" | grep -q UP; then
              echo "Healthy ✅" && exit 0
            fi
            echo "Waiting for app... ($i/24)" && sleep 5
          done
          echo "App did not become healthy within 2 minutes" && exit 1
