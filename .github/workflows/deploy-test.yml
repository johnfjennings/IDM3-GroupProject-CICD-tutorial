# Deploys the develop branch to the team's TEST server on every merge.
#
# Needs (set up by your instructor):
#   - repo secrets TEST_HOST (the test VM's address) and DEPLOY_USER
#   - the team's self-hosted runner (ops-runner VM) registered to this repo,
#     holding the deploy key at ~/.ssh/deploy_key — see 06b-proxmox-tus-lab-setup.md
#
# GitHub's own runners cannot reach the campus test server, so the deploy job
# runs on the self-hosted runner. Both jobs skip themselves in the template repo.
name: deploy-test

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: ./mvnw --batch-mode verify

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (image names must be lower case)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$IMAGE:test-latest" -t "$IMAGE:develop-${{ github.sha }}" .
          docker push --all-tags "$IMAGE"

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to the test server over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.TEST_HOST }}" \
            "cd ~/gallery && docker compose pull app && docker compose up -d app"

      - name: Smoke check the test server
        env:
          BASE_URL: http://${{ secrets.TEST_HOST }}:8080
        run: bash .github/smoke-check.sh
